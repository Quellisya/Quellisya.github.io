# NexT 主题配置（覆盖 node_modules/hexo-theme-next/_config.yml 中的默认值）
# 主题文档: https://theme-next.js.org/docs/

# 主题风格: Muse | Mist | Pisces | Gemini
scheme: Pisces

# 侧边栏菜单
menu:
  home: / || fa fa-home
  Writeups: /categories/CTF/ || fa fa-flag
  archives: /archives/ || fa fa-archive
  RSS: /atom.xml || fa fa-rss

# 自定义样式（首页欢迎区等）
custom_file_path:
  style: source/_data/styles.styl

# 提示框：扁平彩色样式 + 图标，文章里的重点更醒目
note:
  style: flat
  icons: true

# 标签页切换动画
tabs:
  transition:
    tabs: true
    labels: true

# 返回顶部 + 阅读百分比
back2top:
  enable: true
  scrollpercent: true

# 阅读进度条
reading_progress:
  enable: true
  position: top
  color: "#37c6c0"
  height: 3px

# 书签
bookmark:
  enable: true
  save: auto

# GitHub Banner
# 注: 标题文字由语言包控制，NexT 8 不支持自定义 title
github_banner:
  enable: true
  permalink: https://github.com/Quellisya

# 中英文空格自动排版
pangu: true

# 图片点击放大（配合文章里的截图阅读）
fancybox: true

# 文章目录：显示完整层级
toc:
  enable: true
  number: false
  wrap: true
  expand_all: true

# 代码块：语言标签 + 一键复制
codeblock:
  copy_button:
    enable: true
    style: mac
  language: true

# 数学公式（按需加载：文章 front-matter 加 mathjax: true 即启用）
math:
  mathjax:
    enable: true

# Pjax 局部刷新
pjax: true

# 本地搜索
local_search:
  enable: true
